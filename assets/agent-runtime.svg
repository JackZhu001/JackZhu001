  <circle cx="56" cy="33" r="6" fill="#ffd166"/>
  <circle cx="78" cy="33" r="6" fill="#7ee787"/>
  <text x="600" y="40" fill="#8b949e" font-size="14" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">~/yuxi/agent-lab — runtime</text>

